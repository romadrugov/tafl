name: Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.signing.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare preinstalled Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses >/dev/null)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:ai
      - name: Locate browser for UI tests
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install chromium --with-deps; fi
      - run: npm run screenshots
      - run: npm run android:prepare
      - name: Build debug and unsigned release
        run: |
          cd android
          chmod +x gradlew
          # Retry only transient repository throttling, never hide compile failures.
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease 2>&1 | tee /tmp/tafl-gradle.log; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq '429|Too Many Requests' /tmp/tafl-gradle.log; then
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
      - name: Verify debug APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Sign production APK and AAB
        id: signing
        env:
          TAFL_KEYSTORE_BASE64: ${{ secrets.TAFL_KEYSTORE_BASE64 }}
          TAFL_KEYSTORE_PASSWORD: ${{ secrets.TAFL_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAFL_KEYSTORE_BASE64" && -z "$TAFL_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Permanent release signing secrets are missing."
            exit 1
          fi
          if [[ -z "$TAFL_KEYSTORE_BASE64" || -z "$TAFL_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both signing secrets are required."
            exit 1
          fi
          umask 077
          KEYSTORE="$(mktemp "$RUNNER_TEMP/tafl-key-XXXXXX.p12")"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/tafl-aligned.apk"' EXIT
          printf '%s' "$TAFL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          unset TAFL_KEYSTORE_BASE64
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p signed
          APK="signed/TAFL-${VERSION}.apk"
          AAB="signed/TAFL-${VERSION}.aab"
          "$TOOLS/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/tafl-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias tafl --ks-pass env:TAFL_KEYSTORE_PASSWORD --key-pass env:TAFL_KEYSTORE_PASSWORD --out "$APK" "$RUNNER_TEMP/tafl-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signed/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | sed -n '1p' > signed/package.txt
          grep -F "name='com.taflclub' versionCode='42' versionName='0.11.2'" signed/package.txt
          cat signed/package.txt
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env TAFL_KEYSTORE_PASSWORD -keypass:env TAFL_KEYSTORE_PASSWORD -signedjar "$AAB" android/app/build/outputs/bundle/release/app-release.aab tafl
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" > signed/aab-certificate.txt
          (cd signed && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload signed production packages
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TAFL-${{ steps.signing.outputs.version }}-signed
          path: signed/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TAFL-0.11.2-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            www/shots/*.png
            previews/*.png
          if-no-files-found: error

  # Publish only packages produced by the successful, fully tested build above.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: tafl-release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TAFL-${{ needs.build.outputs.version }}-signed
          path: signed
      - name: Publish signed APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd signed
          sha256sum -c SHA256SUMS.txt
          APK="TAFL-${VERSION}.apk"
          test -s "$APK"
          grep -F "name='com.taflclub'" package.txt
          grep -F "versionName='${VERSION}'" package.txt
          BUILD="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" package.txt)"
          test -n "$BUILD"
          sha256sum "$APK" > "$APK.sha256"

          # Never replace an existing release or move its tag.
          # Additional successful builds of the same version receive unique tags.
          TAG="v${VERSION}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1 || gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent >/dev/null 2>&1; then
            TAG="v${VERSION}-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          {
            printf 'Signed Android test build.\n\n'
            printf 'Version: %s · Build: %s\n\n' "$VERSION" "$BUILD"
            printf 'Download the APK from Assets and install it over the previous version.\n\n'
            printf 'All automated game, AI and UI tests passed before signing.\n\n'
            printf 'Source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Build: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" --title "TAFL $VERSION (Build $BUILD)" \
            --prerelease --notes-file release-notes.md
          printf '### Signed APK published\n\n[Download APK](%s/%s/releases/download/%s/%s)\n' "$GITHUB_SERVER_URL" "$GH_REPO" "$TAG" "$APK" >> "$GITHUB_STEP_SUMMARY"
