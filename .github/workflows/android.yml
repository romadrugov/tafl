name: Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare preinstalled Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses >/dev/null)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run android:prepare
      - name: Build debug and unsigned release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: TAFL-0.7.0-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
