name: Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare preinstalled Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses >/dev/null)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:ai
      - name: Locate browser for UI tests
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install chromium --with-deps; fi
      - run: npm run screenshots
      - run: npm run android:prepare
      - name: Build debug and unsigned release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Verify debug APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Sign production APK and AAB
        id: signing
        env:
          TAFL_KEYSTORE_BASE64: ${{ secrets.TAFL_KEYSTORE_BASE64 }}
          TAFL_KEYSTORE_PASSWORD: ${{ secrets.TAFL_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAFL_KEYSTORE_BASE64" && -z "$TAFL_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Permanent release signing secrets are missing."
            exit 1
          fi
          if [[ -z "$TAFL_KEYSTORE_BASE64" || -z "$TAFL_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Both signing secrets are required."
            exit 1
          fi
          umask 077
          KEYSTORE="$(mktemp "$RUNNER_TEMP/tafl-key-XXXXXX.p12")"
          trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/tafl-aligned.apk"' EXIT
          printf '%s' "$TAFL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          unset TAFL_KEYSTORE_BASE64
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          VERSION="$(node -p 'require("./package.json").version')"
          mkdir -p signed
          APK="signed/TAFL-${VERSION}.apk"
          AAB="signed/TAFL-${VERSION}.aab"
          "$TOOLS/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/tafl-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-key-alias tafl --ks-pass env:TAFL_KEYSTORE_PASSWORD --key-pass env:TAFL_KEYSTORE_PASSWORD --out "$APK" "$RUNNER_TEMP/tafl-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee signed/signature.txt
          "$TOOLS/aapt" dump badging "$APK" | sed -n '1p' > signed/package.txt
          grep -F "name='com.taflclub' versionCode='23' versionName='0.9.3'" signed/package.txt
          cat signed/package.txt
          jarsigner -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env TAFL_KEYSTORE_PASSWORD -keypass:env TAFL_KEYSTORE_PASSWORD -signedjar "$AAB" android/app/build/outputs/bundle/release/app-release.aab tafl
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" > signed/aab-certificate.txt
          (cd signed && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload signed production packages
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TAFL-${{ steps.signing.outputs.version }}-signed
          path: signed/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TAFL-0.9.3-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            www/shots/*.png
            previews/*.png
          if-no-files-found: error
