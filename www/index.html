function choose(g,level,options={}){

function newGameId(){return typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}

function recordResult(g){
 if(!gameId)return;
 const rows=readResults(),index=rows.findIndex(x=>x.id===gameId);
 if(!g.win&&index<0)return;
 if(!g.win)rows.splice(index,1);
 else{const row={id:gameId,mode,opponent,human,level,win:g.win,why:g.why,moves:g.log.length,at:Date.now()};
  if(index>=0){const prev=rows[index];if(prev.win===row.win&&prev.moves===row.moves&&prev.why===row.why)return;rows[index]=row}else rows.push(row);
 }

}

function renderStats(){

 const all=readResults().filter(r=>variant==='all'||r.mode===variant);
 const aiRows=all.filter(r=>r.opponent==='ai'&&(side==='all'||String(r.human)===side)&&(lev==='all'||String(r.level)===lev));
 const localRows=all.filter(r=>r.opponent==='local');
 const count=(rows,fn)=>rows.filter(fn).length;
 const wins=count(aiRows,r=>r.win===r.human),loss=count(aiRows,r=>r.win!==3&&r.win!==r.human),draw=count(aiRows,r=>r.win===3);
 const metric=(box,data)=>{const root=$(box);root.replaceChildren();for(const [label,value] of data){const cell=document.createElement('div'),a=document.createElement('strong'),b=document.createElement('small');a.textContent=value;b.textContent=t(label);cell.append(a,b);root.append(cell)}};
 metric('statsAi',[['played',aiRows.length],['victories',wins],['defeats',loss],['draws',draw],['winRate',aiRows.length?Math.round(wins/aiRows.length*100)+'%':'—']]);
 metric('statsLocal',[['played',localRows.length],['blackWins',count(localRows,r=>r.win===1)],['whiteWins',count(localRows,r=>r.win===2)],['draws',count(localRows,r=>r.win===3)]]);
 const root=$('statsRecent');root.replaceChildren();
 const recent=[...aiRows,...localRows].sort((a,b)=>b.at-a.at).slice(0,12);
 if(!recent.length){root.textContent=t('noCompleted');return}
 for(const r of recent){const item=document.createElement('div'),a=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('small'),out=document.createElement('span');item.className='recentGame';title.textContent=variants[r.mode].title;detail.textContent=(r.opponent==='local'?t('vsLocal'):t(r.human===1?'attack':'defend')+' · '+difficulty(r.level))+' · '+r.moves+' '+t('moves')+' · '+new Date(r.at).toLocaleDateString(lang);out.textContent=t(r.win===3?'draw':r.opponent==='local'?r.win===1?'blackWins':'whiteWins':r.win===r.human?'won':'lost');out.className=r.win===3?'statDraw':r.opponent==='ai'&&r.win!==r.human?'statLoss':'statWin';a.append(title,detail);item.append(a,out);root.append(item)}
}

function migrate(){try{const old=JSON.parse(localStorage.getItem('tafl.saved.v1')||'null');if(old&&variants[old.mode]&&Array.isArray(old.moves)&&!localStorage.getItem(SAVE+old.mode)){const eng=Engine(old.mode);let g=eng.start();for(const m of old.moves)g=eng.record(g,m);if(!g.win)localStorage.setItem(SAVE+old.mode,JSON.stringify(old));}localStorage.removeItem('tafl.saved.v1')}catch(err){}}

function resume(k=mode,kind='ai'){const d=readSave(k,kind);if(!d)return refreshSave();try{const eng=Engine(d.mode),h=[eng.start()];for(const m of d.moves)h.push(eng.record(h[h.length-1],m));if(h[h.length-1].win){clearSave(k,kind);refreshSave();return}let forward=[];try{let q=h[h.length-1];for(const m of Array.isArray(d.future)?d.future:[]){q=eng.record(q,m);forward.push(q)}if(kind==='ai'){if(forward.length&&!forward[forward.length-1].win&&forward[forward.length-1].turn!==d.human)forward=[];if(h[h.length-1].turn!==d.human)forward=[]}}catch(err){forward=[]}stop();mode=d.mode;opponent=kind;human=d.human;level=d.level;gameId=typeof d.gameId==='string'?d.gameId:newGameId();e=eng;hist=h;future=forward;persist();showGame()}catch(err){showAction(t('loadError'),t('loadErrorText'),[[t('deleteSave'),'danger',()=>{clearSave(k,kind);closeAction();refreshSave()}],[t('cancel'),'',closeAction]])}}
function closeAction(){$('actionModal').hidden=true;$('actionModal').classList.remove('fromTop')}
function showAction(title,text,buttons){$('actionTitle').textContent=title;$('actionText').textContent=text;$('actionButtons').innerHTML='';for(const [label,cls,fn] of buttons){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;$('actionButtons').append(b)}$('actionModal').hidden=false}
function askExit(){const g=hist[hist.length-1];showAction(t('exitTitle'),g.win?t('finished'):t('exitText'),[...(g.win?[]:[[t('saveExit'),'primary',()=>{if(persist())menu()}]]),[g.win?t('menu'):t('exitNoSave'),'danger',()=>{if(clearSave())menu();else $('actionText').textContent=t('deleteError')}],[t('new'),' ',askRestart],[t('rules'),'',()=>{closeAction();openRules(mode)}],[t('backGame'),'',closeAction]])}

function renderHistory(){const g=hist[hist.length-1];$('historySub').textContent=variants[mode].title+' · '+g.log.length+' '+t('moves');$('log').innerHTML='';const notation=l=>l?e.name(l.m[0])+'–'+e.name(l.m[1])+(l.cap?' ×'+l.cap:''):'—';for(let i=0;i<g.log.length;i+=2){let row=document.createElement('div');row.className='historyRow';for(const value of [(i/2+1)+'.','⚫ '+notation(g.log[i]),'⚪ '+notation(g.log[i+1])]){let el=document.createElement('span');el.textContent=value;row.append(el)}$('log').append(row)}if(!g.log.length)$('log').textContent=t('noMovesYet')}

async function copyHistory(){const text=historyText();const field=$('exportText');field.value=text;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);$('copyStatus').textContent=t('copied');return}}catch(err){}field.hidden=false;field.focus();field.select();field.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch(err){}if(ok){field.hidden=true;$('copyStatus').textContent=t('copied')}else $('copyStatus').textContent=t('manualCopy')}
function render(){let g=hist[hist.length-1],b=g.b,n=e.n,targets=sel>=0?e.dest(b,sel):[];$('blackLabel').textContent=(human===1?t('you'):t('ai'))+' · '+t('attack');$('whiteLabel').textContent=(human===2?t('you'):t('ai'))+' · '+t('defend');const aiLabel=$(human===1?'whiteLabel':'blackLabel'),diff=document.createElement('span');diff.className='aiLevel';diff.textContent=difficulty(level);aiLabel.append(diff);$('bc').textContent='⚫ '+b.filter(x=>x===1).length+'/'+(n===7?8:n===9?16:24);$('wc').textContent='⚪ '+b.filter(x=>x===2).length+'/'+(n===7?4:n===9?8:12)+(b.includes(3)?' + ♔':'');let labels='ABCDEFGHIJK'.slice(0,n).split('');if(flip)labels.reverse();for(let id of ['labels','labels2']){$(id).style.gridTemplateColumns=`repeat(${n},1fr)`;$(id).innerHTML=labels.map(x=>`<span>${x}</span>`).join('')}$('ranks').style.gridTemplateRows=`repeat(${n},1fr)`;$('ranks').innerHTML=Array.from({length:n},(_,i)=>`<span>${n-i}</span>`).join('');$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').innerHTML='';for(let j=0;j<e.L;j++){let i=flip?e.L-1-j:j,p=b[i],el=document.createElement('button');el.className='sq '+((i%n+Math.floor(i/n))%2?'alt ':'')+(e.goal(i)?'goal ':'')+(e.restricted(i)?'restricted ':'')+(g.last.includes(i)?'last ':'')+(g.cap.includes(i)?'cap ':'')+(sel===i?'sel':'');el.setAttribute('aria-label',e.name(i));el.innerHTML=(p?`<span class="piece ${p===1?'black':p===2?'white':'king'}">${p===3?'♔':''}</span>`:targets.includes(i)?'<span class="dot"></span>':e.restricted(i)?'◇':'');el.onclick=()=>click(i);$('board').append(el)}const ended=!!g.win;if(ended){$('status').textContent=t('finished')+' · '+t(g.win===3?'draw':g.win===human?'won':'lost');$('statusSub').textContent=reason(g.why);$('status').style.color=g.win===3?'var(--draw)':(g.win===human?'var(--win)':'var(--lose)');}else if(busy){$('status').textContent=t('thinking');$('statusSub').textContent='';$('status').style.color='';}else{$('status').textContent=t('yourTurn');$('statusSub').textContent=sel>=0?e.name(sel)+' · '+targets.length+' '+t('moves'):'';$('status').style.color='';}if(opponent==='local')renderLocal(g);const canUndo=!busy&&(opponent==='local'?hist.length>1:hist.slice(0,-1).some(x=>x.turn===human));$('undo').disabled=!canUndo;$('redo').disabled=busy||!future.length||ended;$('redo').hidden=!future.length||ended;$('newGameAction').hidden=!ended;$('menuGameAction').hidden=!ended;$('gameActions').classList.toggle('ended',ended);if(!$('historyModal').hidden)renderHistory()}
function ai(){let g=hist[hist.length-1];if(opponent==='local'||g.win||g.turn===human)return;busy=true;render();let t=++token;async function done(o){if(t!==token)return;if(worker){worker.terminate();worker=null}if(o&&o.m){hist.push(e.record(g,o.m));stats='ИИ: глубина '+o.depth+' · '+o.nodes.toLocaleString('ru-RU')+' узлов'}else if(o&&o.error){stats='Ошибка поиска: '+o.error;let m=e.moves(g.b,g.turn)[0];if(m)hist.push(e.record(g,m))}const next=hist[hist.length-1];persist();tone(next.win?'end':next.cap.length?'capture':'move');render();if(next!==g)await animateBoardMove(g,next);if(t!==token)return;busy=false;render()}try{worker=new Worker(URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'})));worker.onmessage=x=>done(x.data);worker.onerror=()=>{if(t!==token)return;worker.terminate();worker=null;setTimeout(()=>{if(t===token)done(e.choose(g,level))},20)};worker.postMessage({mode,g,level})}catch(err){setTimeout(()=>{if(t===token)done(e.choose(g,level))},20)}}
async function click(i){let g=hist[hist.length-1];const player=opponent==='local'?g.turn:human;if(busy||g.win||g.turn!==player)return;if(e.S[g.b[i]]===player){sel=sel===i?-1:i;render();return}if(sel<0||!e.dest(g.b,sel).includes(i))return;const next=e.record(g,[sel,i]);future=[];hist.push(next);sel=-1;busy=true;const turnToken=++token;persist();tone(next.win?'end':next.cap.length?'capture':'move');render();await animateBoardMove(g,next);if(turnToken!==token)return;busy=false;render();ai()}
$('play').onclick=askNew;$('newGameAction').onclick=askRestart;$('menuGameAction').onclick=()=>{clearSave();refreshSave();menu()};$('menuBtn').onclick=()=>opponent==='local'?localMenu():askExit();$('gameRules').onclick=()=>openRules(mode);$('historyBtn').onclick=openHistory;$('copyHistory').onclick=copyHistory;$('closeHistory').onclick=closeHistory;$('closeAction').onclick=closeAction;function undoMove(){if(busy)return;let i=hist.length-2;while(opponent!=='local'&&i>=0&&hist[i].turn!==human)i--;if(i>=0){future=hist.slice(i+1).concat(future);hist=hist.slice(0,i+1);sel=-1;stats='';persist();render()}}function redoMove(){if(busy||!future.length||hist[hist.length-1].win)return;do{hist.push(future.shift())}while(opponent!=='local'&&future.length&&!hist[hist.length-1].win&&hist[hist.length-1].turn!==human);sel=-1;stats='';persist();render();ai()}$('undo').onclick=undoMove;$('redo').onclick=redoMove;
