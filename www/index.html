function preview(k){const eng=Engine(k),b=eng.start().b,el=document.createElement('div');el.className='preview';el.style.gridTemplateColumns=`repeat(${eng.n},1fr)`;for(let i=0;i<b.length;i++){const p=b[i],c=document.createElement('div');c.className='miniCell '+((i%eng.n+Math.floor(i/eng.n))%2?'alt ':'')+(eng.restricted(i)?'restricted ':'')+(eng.goal(i)?'goal ':'');if(p){const piece=document.createElement('span');piece.className='piece '+(p===1?'black':p===2?'white':'king');if(p===3)piece.textContent='♔';c.append(piece)}el.append(c)}return el}
function navState(){try{localStorage.setItem('tafl.gallery',modes[slideIndex])}catch(err){}}
function goSlide(i,smooth=true){slideIndex=Math.max(0,Math.min(modes.length-1,i));const box=$('variants'),el=box.children[slideIndex];if(el&&stage==='gallery'&&!$('menu').hidden&&box.clientWidth){const r=el.getBoundingClientRect(),c=box.getBoundingClientRect();box.scrollTo({left:box.scrollLeft+r.left+r.width/2-c.left-c.width/2,behavior:smooth?'smooth':'auto'})}navState()}
function showStage(next){stage=next;$('galleryStage').hidden=next!=='gallery';$('setupStage').hidden=next!=='setup';if(next==='gallery'){refreshSave();requestAnimationFrame(()=>goSlide(slideIndex,false))}else{ $('setupTitle').textContent=variants[mode].title;$('setupSub').textContent=sub(mode);$('setupPreview').replaceChildren(preview(mode));updateMenu()}window.scrollTo(0,0)}
function setup(k){mode=k;showStage('setup')}
function settings(){const box=$('variants');box.innerHTML='';for(const [i,k] of modes.entries()){const v=variants[k],slide=document.createElement('article');slide.className='slide';slide.innerHTML=`<div class="slideHead"><div><h2>${v.title}</h2><small>${sub(k)}</small></div><button class="rulesMini" aria-label="${t('rules')} ${v.title}">?</button></div><p class="slideDesc">${t(k+'Desc')}</p><div class="slideActions"><button class="primary continueChoice" hidden>${t('continue')}</button><button class="primary newChoice">${t('new')}</button></div>`;slide.insertBefore(preview(k),slide.querySelector('.slideDesc'));slide.querySelector('.rulesMini').onclick=()=>openRules(k);slide.querySelector('.newChoice').onclick=()=>setup(k);slide.querySelector('.continueChoice').onclick=()=>resume(k);box.append(slide);}for(const b of $('sides').children)b.onclick=()=>{human=+b.dataset.value;updateMenu()};for(const b of $('levels').children)b.onclick=()=>{level=+b.dataset.value;updateMenu()};if(stage==='setup'){ $('setupSub').textContent=sub(mode);$('setupTitle').textContent=variants[mode].title}updateMenu();requestAnimationFrame(()=>goSlide(slideIndex,false))}
function updateMenu(){for(const [id,v] of [['sides',String(human)],['levels',String(level)]])for(const b of $(id).children)b.classList.toggle('active',b.dataset.value===v)}
function openRules(k=mode){$('ruleTitle').textContent=variants[k].title;$('ruleSub').textContent=sub(k);$('ruleBody').textContent=ruleText(k);$('ruleBody').style.whiteSpace='pre-line';$('ruleModal').hidden=false}
function closeRules(){$('ruleModal').hidden=true}
function stop(){token++;if(worker){worker.terminate();worker=null}busy=false}
const SAVE='tafl.saved.v2.';
function migrate(){try{const old=JSON.parse(localStorage.getItem('tafl.saved.v1')||'null');if(old&&variants[old.mode]&&Array.isArray(old.moves)&&!localStorage.getItem(SAVE+old.mode)){const eng=Engine(old.mode);let g=eng.start();for(const m of old.moves)g=eng.record(g,m);if(!g.win)localStorage.setItem(SAVE+old.mode,JSON.stringify(old));}localStorage.removeItem('tafl.saved.v1')}catch(err){}}
function readSave(k=mode){try{const d=JSON.parse(localStorage.getItem(SAVE+k)||'null');if(!d||d.v!==1||d.mode!==k||![1,2].includes(d.human)||![0,1,2].includes(d.level)||!Array.isArray(d.moves))return null;return d}catch(err){return null}}
function refreshSave(){for(const [i,k] of modes.entries()){const card=$('variants').children[i];if(!card)continue;const d=readSave(k),btn=card.querySelector('.continueChoice');btn.hidden=!d}}
function clearSave(k=mode){try{localStorage.removeItem(SAVE+k);return true}catch(err){return false}}
function persist(){const g=hist[hist.length-1];if(g.win)return clearSave();try{localStorage.setItem(SAVE+mode,JSON.stringify({v:1,mode,human,level,moves:g.log.map(l=>l.m)}));return true}catch(err){$('actionText').textContent=t('saveError');return false}}
function menu(){stop();$('menu').hidden=false;$('game').hidden=true;$('brandHeader').hidden=false;document.querySelector('main').classList.remove('inGame');closeAction();slideIndex=modes.indexOf(mode);showStage('gallery');updateMenu()}
function showGame(){ $('menu').hidden=true;$('game').hidden=false;$('brandHeader').hidden=true;document.querySelector('main').classList.add('inGame');$('title').textContent=variants[mode].title+' · '+e.n+'×'+e.n;sel=-1;flip=false;stats='';window.scrollTo(0,0);render();ai()}
function start(){stop();e=Engine(mode);hist=[e.start()];closeAction();persist();showGame()}
function resume(k=mode){const d=readSave(k);if(!d)return refreshSave();try{const eng=Engine(d.mode),h=[eng.start()];for(const m of d.moves)h.push(eng.record(h[h.length-1],m));if(h[h.length-1].win){clearSave(k);refreshSave();return}stop();mode=d.mode;human=d.human;level=d.level;e=eng;hist=h;showGame()}catch(err){showAction(t('loadError'),t('loadErrorText'),[[t('deleteSave'),'danger',()=>{clearSave(k);closeAction();refreshSave()}],[t('cancel'),'',closeAction]])}}
function closeAction(){$('actionModal').hidden=true}
function showAction(title,text,buttons){$('actionTitle').textContent=title;$('actionText').textContent=text;$('actionButtons').innerHTML='';for(const [label,cls,fn] of buttons){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;$('actionButtons').append(b)}$('actionModal').hidden=false}
function askExit(){const g=hist[hist.length-1];showAction(t('exitTitle'),g.win?t('finished'):t('exitText'),[...(g.win?[]:[[t('saveExit'),'primary',()=>{if(persist())menu()}]]),[g.win?t('menu'):t('exitNoSave'),'danger',()=>{if(clearSave())menu();else $('actionText').textContent=t('deleteError')}],[t('new'),' ',askRestart],[t('backGame'),'',closeAction]])}
function askNew(){if(!readSave())return start();showAction(t('newTitle'),t('newText'),[[t('new'),'primary',()=>{if(clearSave())start()}],[t('cancel'),'',closeAction]])}
function askRestart(){showAction(t('restartTitle'),t('restartText'),[[t('restart'),'primary',()=>{if(clearSave())start()}],[t('cancel'),'',closeAction]])}
function historyText(){const g=hist[hist.length-1];return t('analyze')+' '+variants[mode].title+' '+e.n+'×'+e.n+' '+t('playing')+' '+t(human===1?'black':'white')+'. '+t('difficulty')+': '+difficulty(level)+'.\n'+t('boardText')+':\n'+Array.from({length:e.n},(_,i)=>g.b.slice(i*e.n,(i+1)*e.n).join('')).join('\n')+'\n'+t('history')+': '+g.log.map(l=>t(l.s===1?'black':'white')+' '+e.name(l.m[0])+'–'+e.name(l.m[1])+(l.cap?' ('+t('captured')+' '+l.cap+')':'')).join(', ')+'\n'+t('result')+': '+reason(g.why)+'\n'+t('next')+': '+(g.win?t('finished'):t(g.turn===1?'black':'white'))}
function renderHistory(){const g=hist[hist.length-1];$('historySub').textContent=variants[mode].title+' · '+g.log.length+' '+t('moves');$('log').innerHTML='';const notation=l=>l?e.name(l.m[0])+'–'+e.name(l.m[1])+(l.cap?' ×'+l.cap:''):'—';for(let i=0;i<g.log.length;i+=2){let row=document.createElement('div');row.className='historyRow';for(const value of [(i/2+1)+'.','⚫ '+notation(g.log[i]),'⚪ '+notation(g.log[i+1])]){let el=document.createElement('span');el.textContent=value;row.append(el)}$('log').append(row)}if(!g.log.length)$('log').textContent=t('noMovesYet')}
function openHistory(){renderHistory();$('copyStatus').textContent='';$('exportText').hidden=true;$('historyModal').hidden=false}
function closeHistory(){$('historyModal').hidden=true}
async function copyHistory(){const text=historyText();const field=$('exportText');field.value=text;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);$('copyStatus').textContent=t('copied');return}}catch(err){}field.hidden=false;field.focus();field.select();field.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch(err){}if(ok){field.hidden=true;$('copyStatus').textContent=t('copied')}else $('copyStatus').textContent=t('manualCopy')}
function render(){let g=hist[hist.length-1],b=g.b,n=e.n,targets=sel>=0?e.dest(b,sel):[];$('blackLabel').textContent=(human===1?t('you'):t('ai'))+' · '+t('attack');$('whiteLabel').textContent=(human===2?t('you'):t('ai'))+' · '+t('defend');const aiLabel=$(human===1?'whiteLabel':'blackLabel'),diff=document.createElement('span');diff.className='aiLevel';diff.textContent=difficulty(level);aiLabel.append(diff);$('bc').textContent='⚫ '+b.filter(x=>x===1).length+'/'+(n===7?8:n===9?16:24);$('wc').textContent='⚪ '+b.filter(x=>x===2).length+'/'+(n===7?4:n===9?8:12)+(b.includes(3)?' + ♔':'');let labels='ABCDEFGHIJK'.slice(0,n).split('');if(flip)labels.reverse();for(let id of ['labels','labels2']){$(id).style.gridTemplateColumns=`repeat(${n},1fr)`;$(id).innerHTML=labels.map(x=>`<span>${x}</span>`).join('')}$('ranks').style.gridTemplateRows=`repeat(${n},1fr)`;$('ranks').innerHTML=Array.from({length:n},(_,i)=>`<span>${n-i}</span>`).join('');$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').innerHTML='';for(let j=0;j<e.L;j++){let i=flip?e.L-1-j:j,p=b[i],el=document.createElement('button');el.className='sq '+((i%n+Math.floor(i/n))%2?'alt ':'')+(e.goal(i)?'goal ':'')+(e.restricted(i)?'restricted ':'')+(g.last.includes(i)?'last ':'')+(g.cap.includes(i)?'cap ':'')+(sel===i?'sel':'');el.setAttribute('aria-label',e.name(i));el.innerHTML=(p?`<span class="piece ${p===1?'black':p===2?'white':'king'}">${p===3?'♔':''}</span>`:targets.includes(i)?'<span class="dot"></span>':e.restricted(i)?'◇':'');el.onclick=()=>click(i);$('board').append(el)}const ended=!!g.win;if(ended){$('status').textContent=t('finished')+' · '+t(g.win===3?'draw':g.win===human?'won':'lost');$('statusSub').textContent=reason(g.why);$('status').style.color=g.win===3?'var(--draw)':(g.win===human?'var(--win)':'var(--lose)');}else if(busy){$('status').textContent=t('thinking');$('statusSub').textContent='';$('status').style.color='';}else{$('status').textContent=t('yourTurn');$('statusSub').textContent=sel>=0?e.name(sel)+' · '+targets.length+' '+t('moves'):'';$('status').style.color='';}const canUndo=!busy&&hist.slice(0,-1).some(x=>x.turn===human);$('undo').disabled=!canUndo;$('newGameAction').hidden=!ended;$('menuGameAction').hidden=!ended;$('gameActions').classList.toggle('ended',ended);if(!$('historyModal').hidden)renderHistory()}
function ai(){let g=hist[hist.length-1];if(g.win||g.turn===human)return;busy=true;render();let t=++token;function done(o){if(t!==token)return;if(worker){worker.terminate();worker=null}if(o&&o.m){hist.push(e.record(g,o.m));stats='ИИ: глубина '+o.depth+' · '+o.nodes.toLocaleString('ru-RU')+' узлов'}else if(o&&o.error){stats='Ошибка поиска: '+o.error;let m=e.moves(g.b,g.turn)[0];if(m)hist.push(e.record(g,m))}busy=false;persist();tone(hist[hist.length-1].win?'end':hist[hist.length-1].cap.length?'capture':'move');render()}try{worker=new Worker(URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'})));worker.onmessage=x=>done(x.data);worker.onerror=()=>{if(t!==token)return;worker.terminate();worker=null;setTimeout(()=>{if(t===token)done(e.choose(g,level))},20)};worker.postMessage({mode,g,level})}catch(err){setTimeout(()=>{if(t===token)done(e.choose(g,level))},20)}}
function click(i){let g=hist[hist.length-1];if(busy||g.win||g.turn!==human)return;if(e.S[g.b[i]]===human){sel=sel===i?-1:i;render();return}if(sel<0||!e.dest(g.b,sel).includes(i))return;hist.push(e.record(g,[sel,i]));sel=-1;persist();tone(hist[hist.length-1].win?'end':hist[hist.length-1].cap.length?'capture':'move');render();ai()}
$('play').onclick=askNew;$('newGameAction').onclick=askRestart;$('menuGameAction').onclick=()=>{clearSave();refreshSave();menu()};$('menuBtn').onclick=askExit;$('gameRules').onclick=()=>openRules(mode);$('historyBtn').onclick=openHistory;$('copyHistory').onclick=copyHistory;$('closeHistory').onclick=closeHistory;$('closeAction').onclick=closeAction;function undoMove(){if(busy)return;let i=hist.length-2;while(i>=0&&hist[i].turn!==human)i--;if(i>=0){hist=hist.slice(0,i+1);sel=-1;stats='';persist();render()}}$('undo').onclick=undoMove;$('closeRules').onclick=closeRules;for(const [id,fn] of [['ruleModal',closeRules],['actionModal',closeAction],['historyModal',closeHistory]])$(id).onclick=e=>{if(e.target.id===id)fn()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRules();closeHistory();closeAction();$('settingsModal').hidden=true}});$('language').onchange=()=>{lang=$('language').value;try{localStorage.setItem('tafl.lang',lang)}catch(err){}applyLanguage()};migrate();$('settingsBtn').onclick=()=>{$('settingsModal').hidden=false};$('closeSettings').onclick=()=>{$('settingsModal').hidden=true};$('settingsModal').onclick=e=>{if(e.target.id==='settingsModal')$('settingsModal').hidden=true};$('soundEnabled').checked=sound;$('soundEnabled').onchange=()=>{sound=$('soundEnabled').checked;try{localStorage.setItem('tafl.sound',sound?'on':'off')}catch(err){}if(sound){unlockAudio();if(audio)audio.resume().then(()=>tone()).catch(()=>{})}};document.addEventListener('pointerdown',unlockAudio,{passive:true});$('setupBack').onclick=()=>showStage('gallery');$('variants').addEventListener('scroll',()=>{const box=$('variants');if(!box.clientWidth)return;const c=box.getBoundingClientRect(),mid=c.left+c.width/2;let near=0,best=Infinity;for(const [i,el] of [...box.children].entries()){const r=el.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid);if(d<best){best=d;near=i}}if(near!==slideIndex){slideIndex=near;navState()}},{passive:true});$('variants').addEventListener('keydown',ev=>{if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();goSlide(slideIndex+(ev.key==='ArrowRight'?1:-1))}});applyLanguage();showStage('gallery');
</script></body></html>
